<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Don't Wake the Monster</title>
  <style>
    body { margin: 0; background: #111; }
    canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const sprites = {}; // socket id -> player rectangle

    class GameScene extends Phaser.Scene {
      create() {
        this.keys = this.input.keyboard.addKeys("W,A,S,D,UP,DOWN,LEFT,RIGHT,SHIFT,R,E,L");
        this.wallSprites = [];

        // Draw order matters: exit first so everything else sits on top
        this.exit = this.add.rectangle(0, 0, 10, 10, 0x1b5e20);
        this.exitText = this.add.text(0, 0, "EXIT", { fontSize: "14px", color: "#8f8" }).setOrigin(0.5);

        this.lootSprites = {}; // loot index -> { box, label }
        this.scoreText = this.add.text(780, 15, "", { fontSize: "16px", color: "#ffeb3b" }).setOrigin(1, 0);

        this.monster = this.add.rectangle(0, 0, 48, 48, 0xd32f2f);
        this.monsterText = this.add.text(0, 0, "", { fontSize: "14px", color: "#fff" }).setOrigin(0.5);

        this.add.text(20, 15, "NOISE", { fontSize: "16px", color: "#fff" });
        this.add.rectangle(80, 24, 300, 16, 0x333333).setOrigin(0, 0.5);
        this.noiseBar = this.add.rectangle(80, 24, 0, 16, 0xffc107).setOrigin(0, 0.5);

        this.add.text(400, 580, "WASD: walk · Shift: run · E: pick up/drop · L: leave (in exit)", { fontSize: "13px", color: "#888" }).setOrigin(0.5);
        this.bigText = this.add.text(400, 300, "", { fontSize: "40px", color: "#fff", align: "center" }).setOrigin(0.5);

        this.roleText = this.add.text(400, 15, "", { fontSize: "16px", color: "#fff" }).setOrigin(0.5, 0);

        socket.on("state", (state) => this.applyState(state));
      }

      applyState(state) {
        // Walls and doors never change, so only draw them once
        if (this.wallSprites.length === 0) {
          for (const w of state.walls) {
            this.wallSprites.push(this.add.rectangle(w.x, w.y, w.w, w.h, 0x555555).setOrigin(0, 0));
          }
          for (const d of state.doors) {
            this.wallSprites.push(this.add.rectangle(d.x, d.y, d.w, d.h, 0x6d4c41, 0.5).setOrigin(0, 0));
          }
        }

        for (const id in state.players) {
          if (!sprites[id]) {
            const color = id === socket.id ? 0x4caf50 : 0x2196f3;
            sprites[id] = this.add.rectangle(0, 0, 32, 32, color);
          }
          sprites[id].setPosition(state.players[id].x, state.players[id].y);
        }
        for (const id in sprites) {
          if (!state.players[id]) {
            sprites[id].destroy();
            delete sprites[id];
          }
        }

        state.loot.forEach((item, i) => {
          if (!this.lootSprites[i]) {
            this.lootSprites[i] = {
              box: this.add.rectangle(0, 0, 20, 20, 0xffeb3b),
              label: this.add.text(0, 0, "", { fontSize: "12px", color: "#ff9" }).setOrigin(0.5),
            };
          }
          const s = this.lootSprites[i];
          s.box.setVisible(!item.secured);
          s.label.setVisible(!item.secured && !item.carriedBy);
          s.box.setPosition(item.x, item.y);
                    s.label.setPosition(item.x, item.y - 18).setText(item.value === null ? "?" : `${item.name} ($${item.value})`);
        });

        this.exit.setPosition(state.exit.x, state.exit.y).setSize(state.exit.w, state.exit.h);
        this.exitText.setPosition(state.exit.x, state.exit.y);

        this.roleText.setText(state.role === "lookout" ? "LOOKOUT – you see the monster" : "THIEF – you see the loot");

        const seesMonster = state.monster !== null;
        this.monster.setVisible(seesMonster);
        this.monsterText.setVisible(seesMonster);
        if (seesMonster) {
          this.monster.setPosition(state.monster.x, state.monster.y);
          this.monsterText.setPosition(state.monster.x, state.monster.y - 40);
          this.monsterText.setText(state.monster.status === "SLEEPING" ? "zzz" : state.monster.status);
        }

        const seesNoise = state.noise !== null;
        this.noiseBar.setVisible(seesNoise);
        if (seesNoise) {
          this.noiseBar.width = state.noise * 3;
          this.noiseBar.fillColor = state.noise > 50 ? 0xf44336 : 0xffc107;
        }

        this.scoreText.setText("SCORE: $" + state.score);

        if (!state.gameOver) this.bigText.setText("");
        else if (state.result === "WIN") this.bigText.setText(`YOU GOT AWAY!\n$${state.score}\nPress R`);
        else this.bigText.setText("WHO WOKE ME?\nYou got caught – press R");
      }

      update() {
        const k = this.keys;
        socket.emit("input", {
          up: k.W.isDown || k.UP.isDown,
          down: k.S.isDown || k.DOWN.isDown,
          left: k.A.isDown || k.LEFT.isDown,
          right: k.D.isDown || k.RIGHT.isDown,
          run: k.SHIFT.isDown,
        });
        if (Phaser.Input.Keyboard.JustDown(k.E)) socket.emit("interact");
        if (Phaser.Input.Keyboard.JustDown(k.L)) socket.emit("leave");
        if (Phaser.Input.Keyboard.JustDown(k.R)) socket.emit("restart");
      }
    }

    new Phaser.Game({
      type: Phaser.AUTO,
      width: 800,
      height: 600,
      backgroundColor: "#222",
      scene: GameScene,
    });
  </script>
</body>
</html>
