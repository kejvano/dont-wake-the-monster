<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Don't Wake the Monster</title>
  <style>
    body { margin: 0; background: #050505; }
    canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const GLOW_RADIUS = 30;  // just enough to see your own feet
    const SHADOW_RAYS = 48;  // rays cast across the cone to find wall shadows
    const GHOST_LIGHT_RADIUS = 50;
    const DARKNESS = 0.985;

    // All sounds are synthesized so there are no assets to load.
    // Browsers only allow audio after a key press, hence init().
    const sfx = {
      ctx: null,

      init() {
        if (!this.ctx) this.ctx = new AudioContext();
        if (this.ctx.state === "suspended") this.ctx.resume();
      },

      envelope(peak, attack, release) {
        const g = this.ctx.createGain();
        const t = this.ctx.currentTime;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(peak, t + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, t + attack + release);
        g.connect(this.ctx.destination);
        return g;
      },

      thump(volume) {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        osc.frequency.setValueAtTime(70, t);
        osc.frequency.exponentialRampToValueAtTime(40, t + 0.15);
        osc.connect(this.envelope(volume, 0.01, 0.18));
        osc.start(t);
        osc.stop(t + 0.25);
      },

      heartbeat(volume) {
        this.thump(volume);
        setTimeout(() => this.thump(volume * 0.7), 160);
      },

      noise(seconds) {
        const len = Math.floor(this.ctx.sampleRate * seconds);
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        const src = this.ctx.createBufferSource();
        src.buffer = buf;
        return src;
      },

      filter(type, freq, q = 1) {
        const f = this.ctx.createBiquadFilter();
        f.type = type;
        f.frequency.value = freq;
        f.Q.value = q;
        return f;
      },

      snore(volume) {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const src = this.noise(1.4);
        const filter = this.ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(180, t);
        filter.frequency.linearRampToValueAtTime(420, t + 0.9);
        src.connect(filter);
        filter.connect(this.envelope(volume, 0.7, 0.6));
        src.start(t);
      },

      roar(volume) {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(45, t + 1.1);
        const filter = this.ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 600;
        osc.connect(filter);
        filter.connect(this.envelope(volume, 0.05, 1.1));
        osc.start(t);
        osc.stop(t + 1.3);
      },

      // A creak is a hinge sticking and slipping: a raspy buzz whose rate
      // wobbles upward. The monster's is slower, deeper and longer.
      creak(volume, deep = false) {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const length = deep ? 1.3 : 0.6;
        const base = deep ? 16 : 28;
        const curve = new Float32Array(24);
        for (let i = 0; i < curve.length; i++) {
          const k = i / (curve.length - 1);
          curve[i] = base * (1 + 0.8 * Math.sin(k * Math.PI * 0.8)) * (0.9 + Math.random() * 0.2);
        }
        const osc = this.ctx.createOscillator();
        osc.type = "sawtooth";
        osc.frequency.setValueCurveAtTime(curve, t, length);
        const band = this.filter("bandpass", deep ? 650 : 1400, 3);
        osc.connect(band);
        band.connect(this.envelope(volume, 0.05, length));
        osc.start(t);
        osc.stop(t + length + 0.1);
      },

      slam(volume) {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const src = this.noise(0.4);
        const low = this.filter("lowpass", 900);
        src.connect(low);
        low.connect(this.envelope(volume, 0.005, 0.35));
        src.start(t);
        this.thump(volume * 1.5);
      },

      click(volume) {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const src = this.noise(0.08);
        const high = this.filter("bandpass", 2500, 2);
        src.connect(high);
        high.connect(this.envelope(volume, 0.003, 0.06));
        src.start(t);
        this.thump(volume * 0.6);
      },
    };

    // Distance along a ray to the first wall it hits, or `max` if none
    // (slab test against each axis-aligned wall rectangle)
    function castRay(walls, x, y, dx, dy, max) {
      let best = max;
      for (const w of walls) {
        let tmin = 0, tmax = best;
        for (const [pos, d, lo, hi] of [[x, dx, w.x, w.x + w.w], [y, dy, w.y, w.y + w.h]]) {
          if (Math.abs(d) < 1e-9) {
            if (pos < lo || pos > hi) { tmin = Infinity; break; }
            continue;
          }
          const t1 = (lo - pos) / d, t2 = (hi - pos) / d;
          tmin = Math.max(tmin, Math.min(t1, t2));
          tmax = Math.min(tmax, Math.max(t1, t2));
          if (tmin > tmax) break;
        }
        if (tmin <= tmax && tmin < best) best = tmin;
      }
      return best;
    }

    class GameScene extends Phaser.Scene {
      create() {
        this.keys = this.input.keyboard.addKeys("W,A,S,D,UP,DOWN,LEFT,RIGHT,SHIFT,R,E,L");
        this.input.keyboard.on("keydown", () => sfx.init());

        this.state = null;
        this.built = false;
        this.playerSprites = {};
        this.lootSprites = [];
        this.nextSnore = 0;
        this.nextBeat = 0;

        // Soft glow around each player. The flashlight cone is made in
        // buildHouse() because its size comes from the server.
        this.glowBrush = this.makeBrush("glow", 128, (ctx, r) => {
          ctx.fillRect(0, 0, r * 2, r * 2);
        });
        this.aim = 0;

        // Each flashlight is drawn here first, has its wall shadows cut out,
        // and is then erased from the darkness
        this.lightLayer = this.make.renderTexture({ x: 0, y: 0, width: 800, height: 600, add: false }).setOrigin(0, 0);
        this.shadows = this.make.graphics({ add: false });

        // Depth layers: world (0-10) < darkness (20) < what you can always
        // perceive: walls, sounds (25-30) < HUD (40)
        this.monster = this.add.rectangle(0, 0, 44, 44, 0x8e1b1b).setDepth(10);
        this.monsterEyes = this.add.text(0, 0, "◉ ◉", { fontSize: "12px", color: "#ff5252" }).setOrigin(0.5).setDepth(10);
        this.darkness = this.add.renderTexture(0, 0, 800, 600).setOrigin(0, 0).setDepth(20);
        this.rings = this.add.graphics().setDepth(30);
        this.zzz = this.add.text(0, 0, "", { fontSize: "16px", color: "#9fa8da", fontStyle: "italic" }).setOrigin(0.5).setDepth(30);

        this.hud = this.add.text(12, 12, "", { fontSize: "15px", color: "#ddd", backgroundColor: "#000a", padding: { x: 6, y: 4 } }).setDepth(40);
        this.status = this.add.text(788, 12, "", { fontSize: "15px", color: "#ffeb3b", backgroundColor: "#000a", padding: { x: 6, y: 4 }, align: "right" }).setOrigin(1, 0).setDepth(40);
        this.add.text(400, 588, "WASD walk · Shift run (loud) · E door / grab / drop / hide · L leave from the exit", { fontSize: "12px", color: "#777" }).setOrigin(0.5, 1).setDepth(40);
        this.bigText = this.add.text(400, 280, "", { fontSize: "34px", color: "#fff", align: "center", backgroundColor: "#000c", padding: { x: 16, y: 12 } }).setOrigin(0.5).setDepth(40).setVisible(false);
        this.flash = this.add.rectangle(0, 0, 800, 600, 0xb71c1c, 0).setOrigin(0, 0).setDepth(35);

        socket.on("state", (state) => this.applyState(state));
      }

      // Static parts of the house, drawn once from the first snapshot
      buildHouse(state) {
        // The cone's apex sits at the texture's center so rotating the image
        // swings it around the player
        this.flashlight = state.flashlight;
        const half = state.flashlight.halfAngle;
        this.coneBrush = this.makeBrush("cone", state.flashlight.range, (ctx, r) => {
          ctx.filter = "blur(4px)";
          ctx.beginPath();
          ctx.moveTo(r, r);
          ctx.arc(r, r, r - 6, -half, half);
          ctx.closePath();
          ctx.fill();
        });

        for (const r of state.rooms) {
          this.add.rectangle(r.x, r.y, r.w, r.h, r.floor).setOrigin(0, 0).setDepth(0);
          this.add.text(r.x + r.w / 2, r.y + r.h / 2, r.name, { fontSize: "18px", color: "#ffffff22" }).setOrigin(0.5).setDepth(1);
        }
        for (const h of state.hides) {
          this.add.rectangle(h.x, h.y, 34, 34, 0x4e342e).setStrokeStyle(2, 0x6d4c41).setDepth(2);
          this.add.text(h.x, h.y + 24, h.name, { fontSize: "10px", color: "#a1887f" }).setOrigin(0.5).setDepth(2);
        }
        const e = state.exit;
        this.add.rectangle(e.x, e.y, e.w, e.h, 0x1b5e20, 0.6).setOrigin(0, 0).setStrokeStyle(2, 0x43a047).setDepth(25);
        this.add.text(e.x + e.w / 2, e.y + e.h / 2, "EXIT", { fontSize: "14px", color: "#81c784" }).setOrigin(0.5).setDepth(25);
        for (const w of state.walls) {
          this.add.rectangle(w.x, w.y, w.w, w.h, 0x3a3a40).setOrigin(0, 0).setDepth(25);
        }
        // A closed door is a solid slab. An open one is swung 90 degrees off
        // its hinge into the room, leaving the gap empty.
        this.doorSprites = state.doors.map((d) => {
          const vertical = d.h > d.w;
          const panel = vertical
            ? { x: d.x + d.w, y: d.y, w: d.h * 0.9, h: 4 }
            : { x: d.x, y: d.y + d.h, w: 4, h: d.w * 0.9 };
          return {
            closed: this.add.rectangle(d.x, d.y, d.w, d.h, 0x6d4c41).setOrigin(0, 0).setStrokeStyle(1, 0x8d6e63).setDepth(25),
            open: this.add.rectangle(panel.x, panel.y, panel.w, panel.h, 0x6d4c41, 0.7).setOrigin(0, 0).setDepth(25),
          };
        });
        this.built = true;
      }

      applyState(state) {
        if (!this.built) this.buildHouse(state);
        this.state = state;
        for (const ev of state.events) this.handleEvent(ev);

        for (const id in state.players) {
          const p = state.players[id];
          if (!this.playerSprites[id]) {
            this.playerSprites[id] = this.add.rectangle(0, 0, 28, 28, p.color).setDepth(8);
            if (id === socket.id) this.playerSprites[id].setStrokeStyle(2, 0xffffff);
          }
          const s = this.playerSprites[id];
          s.setPosition(p.x, p.y);
          s.setAlpha(p.caught ? 0.3 : p.hidden !== -1 ? 0.5 : 1);
          s.setVisible(!p.escaped);
        }
        for (const id in this.playerSprites) {
          if (!state.players[id]) {
            this.playerSprites[id].destroy();
            delete this.playerSprites[id];
          }
        }

        // Loot is re-rolled every night, so the sprite list can change length
        while (this.lootSprites.length < state.loot.length) {
          this.lootSprites.push({
            box: this.add.rectangle(0, 0, 16, 16, 0xffd54f).setDepth(6),
            label: this.add.text(0, 0, "", { fontSize: "11px", color: "#ffe082" }).setOrigin(0.5).setDepth(6),
          });
        }
        this.lootSprites.forEach((s, i) => {
          const item = state.loot[i];
          const show = item && !item.secured;
          s.box.setVisible(!!show);
          s.label.setVisible(!!show && !item.carriedBy);
          if (!show) return;
          s.box.setPosition(item.x, item.y).setDepth(item.carriedBy ? 9 : 6);
          s.label.setPosition(item.x, item.y - 16).setText(`${item.name} $${item.value}`);
        });

        const m = state.monster;
        this.monster.setPosition(m.x, m.y);
        this.monsterEyes.setPosition(m.x, m.y - 6);
        const asleep = m.status === "SLEEPING" || m.status === "STIRRING";
        this.monsterEyes.setText(asleep ? "— —" : "◉ ◉");
        // The snoring tells you where it is. When it stops, you don't know.
        this.zzz.setPosition(m.x + 18, m.y - 34);
        this.zzz.setText(m.status === "SLEEPING" ? "z z Z" : m.status === "STIRRING" ? "hnngh..." : "");

        state.doors.forEach((d, i) => {
          this.doorSprites[i].closed.setVisible(!d.open);
          this.doorSprites[i].open.setVisible(d.open);
        });

        this.drawRings(state);
        this.drawHud(state);
      }

      // Door sounds fade with distance from you, so a far-off creak in the
      // dark is the only warning you get
      handleEvent(ev) {
        if (ev.type === "door") {
          const me = this.state.players[socket.id];
          const dist = me ? Math.hypot(ev.x - me.x, ev.y - me.y) : 0;
          const near = Math.max(0.05, 1 - dist / 700);
          if (ev.kind === "creak") sfx.creak(0.25 * near);
          else if (ev.kind === "monster") sfx.creak(0.45 * near, true);
          else if (ev.kind === "slam") sfx.slam(0.6 * near);
          else if (ev.kind === "close") sfx.click(0.3 * near);
        } else if (ev.type === "wake") {
          sfx.roar(0.15);
        } else if (ev.type === "chase") {
          sfx.roar(0.5);
          this.cameras.main.shake(400, 0.01);
        } else if (ev.type === "caught") {
          sfx.roar(0.7);
          this.cameras.main.shake(600, 0.02);
          this.flash.setFillStyle(0xb71c1c, 0.5);
          this.tweens.add({ targets: this.flash, fillAlpha: 0, duration: 700 });
        }
      }

      // Draws a white shape that fades out towards its edge. The brush is
      // kept at 0,0 and drawn with an offset, which works the same whether
      // erase() treats x/y as a position or as an offset.
      makeBrush(key, radius, shape) {
        const tex = this.textures.createCanvas(key, radius * 2, radius * 2);
        const ctx = tex.getContext();
        const grad = ctx.createRadialGradient(radius, radius, 0, radius, radius, radius);
        grad.addColorStop(0, "rgba(255,255,255,1)");
        grad.addColorStop(0.6, "rgba(255,255,255,0.85)");
        grad.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = grad;
        shape(ctx, radius);
        tex.refresh();
        return this.make.image({ key, add: false });
      }

      drawDarkness() {
        const state = this.state;
        if (!state || !this.built) return;
        this.darkness.clear();
        this.darkness.fill(0x000000, DARKNESS);
        const blockers = state.walls.concat(state.doors.filter((d) => !d.open));
        for (const [id, p] of Object.entries(state.players)) {
          if (p.escaped) continue;
          const glow = p.caught ? GHOST_LIGHT_RADIUS : GLOW_RADIUS;
          this.glowBrush.setScale(glow / 128);
          this.darkness.erase(this.glowBrush, p.x, p.y);

          // Ghosts and hiding players have their flashlight off
          if (p.caught || p.hidden !== -1) continue;
          const aim = id === socket.id ? this.aim : p.aim;
          this.lightLayer.clear();
          this.coneBrush.setRotation(aim);
          this.lightLayer.draw(this.coneBrush, p.x, p.y);
          this.drawShadows(blockers, p, aim);
          this.lightLayer.erase(this.shadows, 0, 0);
          this.darkness.erase(this.lightLayer, 0, 0);
        }
      }

      // Casts rays across the cone. Wherever a ray hits a wall before the
      // end of the beam, everything behind the hit is shadow.
      drawShadows(walls, p, aim) {
        const { range } = this.flashlight;
        // A bit wider than the beam so its blurred edge is covered too
        const halfAngle = this.flashlight.halfAngle + 0.08;
        const far = range + 20;
        const g = this.shadows;
        g.clear();
        g.fillStyle(0xffffff, 1);

        // Neighbouring blocked rays become one polygon (hit points out,
        // beam end back) so there are no seams for light to leak through
        // Each run starts and ends on an unblocked ray (when there is one)
        // so the shadow edge sits between rays rather than on them
        let run = [], blocked = false;
        const flush = () => {
          if (blocked) {
            g.fillPoints([...run.map((r) => r.near), ...run.map((r) => r.far).reverse()], true);
          }
        };
        for (let i = 0; i <= SHADOW_RAYS; i++) {
          const a = aim - halfAngle + (2 * halfAngle * i) / SHADOW_RAYS;
          const dx = Math.cos(a), dy = Math.sin(a);
          const hit = castRay(walls, p.x, p.y, dx, dy, far);
          const ray = {
            near: { x: p.x + dx * hit, y: p.y + dy * hit },
            far: { x: p.x + dx * far, y: p.y + dy * far },
          };
          run.push(ray);
          if (hit < range) {
            blocked = true;
          } else {
            flush();
            run = [ray];
            blocked = false;
          }
        }
        flush();
      }

      // Sound is visible: every noise is a ring expanding to its full reach
      drawRings(state) {
        this.rings.clear();
        for (const n of state.noises) {
          const t = n.age / 24;
          this.rings.lineStyle(2, n.r > 150 ? 0xff7043 : 0xe0e0e0, (1 - t) * 0.6);
          this.rings.strokeCircle(n.x, n.y, Math.max(1, n.r * t));
        }
      }

      drawHud(state) {
        this.hud.setText(`NIGHT ${state.night}   QUOTA $${state.quota}   SECURED $${state.score}   TOTAL $${state.bank}`);

        const me = state.players[socket.id];
        let status = "";
        if (me) {
          if (me.caught) status = "You were caught. Float around and help.";
          else if (me.hidden !== -1) status = `Hiding in the ${state.hides[me.hidden].name.toLowerCase()} (E to leave)`;
          else if (me.carrying !== -1) status = `Carrying: ${state.loot[me.carrying].name}`;
        }
        this.status.setText(status).setVisible(status !== "");

        if (!state.gameOver) {
          this.bigText.setVisible(false);
          return;
        }
        const msg = {
          CLEARED: `NIGHT ${state.night} CLEARED\n$${state.score} of $${state.quota}\n\nR: next night`,
          SHORT: `YOU GOT OUT... WITH $${state.score}\nThe quota was $${state.quota}.\n\nR: start over`,
          DEAD: `NOBODY MADE IT OUT\nNight ${state.night}, total $${state.bank}\n\nR: start over`,
        }[state.result];
        this.bigText.setText(msg).setVisible(true);
      }

      update(time) {
        const k = this.keys;
        const me = this.state && this.state.players[socket.id];
        if (me) {
          const pointer = this.input.activePointer;
          this.aim = Math.atan2(pointer.worldY - me.y, pointer.worldX - me.x);
        }
        socket.emit("input", {
          up: k.W.isDown || k.UP.isDown,
          down: k.S.isDown || k.DOWN.isDown,
          left: k.A.isDown || k.LEFT.isDown,
          right: k.D.isDown || k.RIGHT.isDown,
          run: k.SHIFT.isDown,
          aim: this.aim,
        });
        if (Phaser.Input.Keyboard.JustDown(k.E)) socket.emit("interact");
        if (Phaser.Input.Keyboard.JustDown(k.L)) socket.emit("leave");
        if (Phaser.Input.Keyboard.JustDown(k.R)) socket.emit("restart");

        // Redrawn every frame rather than per server update so your own
        // flashlight follows the mouse without network lag
        this.drawDarkness();
        this.playAmbience(time);
      }

      // Snoring while it sleeps, a heartbeat that speeds up as it gets
      // closer once it's awake. Both are relative to your own position.
      playAmbience(time) {
        const state = this.state;
        const me = state && state.players[socket.id];
        if (!me || state.gameOver) return;
        const m = state.monster;
        const dist = Math.hypot(m.x - me.x, m.y - me.y);

        if (m.status === "SLEEPING") {
          if (time > this.nextSnore) {
            sfx.snore(Math.max(0.02, 0.35 * (1 - dist / 900)));
            this.nextSnore = time + 2600 + Math.random() * 600;
          }
        } else if (m.status !== "STIRRING" && !me.caught) {
          if (time > this.nextBeat) {
            sfx.heartbeat(Math.max(0.15, 0.9 * (1 - dist / 600)));
            this.nextBeat = time + Phaser.Math.Clamp(dist * 2.2, 320, 1300);
          }
        }
      }
    }

    new Phaser.Game({
      type: Phaser.AUTO,
      width: 800,
      height: 600,
      backgroundColor: "#000",
      scene: GameScene,
    });
  </script>
</body>
</html>
